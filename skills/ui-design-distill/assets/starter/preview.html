<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neutral starter example</title><style>:root{--ink:#20282b;--paper:#fafaf8;--panel:#eef1ef;--accent:#204f48}*{box-sizing:border-box}body{margin:0;font:18px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}main{max-width:1040px;margin:auto;padding:32px 24px}h1,h2{line-height:1.12}h1{font-size:clamp(2rem,5vw,3.4rem);max-width:20ch}a{color:var(--accent)}button,input{font:inherit}button{padding:10px 18px;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.note{font-size:14px}section{margin-block:32px}article{padding:24px;background:var(--panel);min-width:0}p{overflow-wrap:anywhere}</style><main><p class="note">Neutral local form example · no data is sent</p><h1>Project contact</h1><form id="contact-form" novalidate><section id="error-summary" tabindex="-1" role="alert" hidden><h2>Check the email address</h2><a href="#email">Enter an address in the expected format</a></section><p><label for="contact-name">Name</label><input id="contact-name" name="contact-name" autocomplete="name"></p><p><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error"><span id="email-error"></span></p><button type="submit">Save locally</button><p id="result" role="status"></p></form></main><style>form{max-width:560px}label,input{display:block}input{width:100%;padding:10px;border:1px solid #65716e}#error-summary{padding:16px;background:var(--panel)}#error-summary h2{font-size:22px}#email-error{display:block}button{color:var(--paper);background:var(--accent);border:0}</style><script>const form=document.getElementById('contact-form'),email=document.getElementById('email'),summary=document.getElementById('error-summary');form.addEventListener('submit',event=>{event.preventDefault();const invalid=!email.checkValidity();summary.hidden=!invalid;email.setAttribute('aria-invalid',String(invalid));document.getElementById('email-error').textContent=invalid?'Use a complete email address.':'';document.getElementById('result').textContent=invalid?'':'Saved for this demonstration only.';if(invalid)summary.focus();});</script></html>
